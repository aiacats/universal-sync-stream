[workspace]
resolver = "2"
members = [
    "crates/ussp",
    "crates/ussp-sfu",
    "crates/ussp-control",
    "apps/ussp-studio/src-tauri",
    "apps/ussp-admin/src-tauri",
    "apps/ussp-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yourusername/ussp"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"

[patch.crates-io]
nokhwa-bindings-macos = { path = "patches/nokhwa-bindings-macos" }
nokhwa-core = { path = "patches/nokhwa-core" }
